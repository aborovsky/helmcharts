# NTLM authenticates the TCP connection, so the server is exposed through
# an L4 NLB instead of ingress-nginx, which pools upstream connections.
# TLS is terminated by the server itself (certificate from .Values.tls.secretName).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "5"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "5"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-unhealthy-threshold: "3"
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: Bright.Environment=testground,Bright.CostCategory=qa
    external-dns.alpha.kubernetes.io/hostname: {{ .Release.Name }}.nlb.brokencrystals.nexploit.app
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  selector:
    app: {{ .Release.Name }}
  ports:
  - name: https
    protocol: TCP
    port: 443
    targetPort: 8443
